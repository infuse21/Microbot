name: Walker V2 Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Walker-V2
        uses: actions/checkout@v4
        with:
          ref: refs/heads/Walker-V2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Build Shaded JAR
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          ./gradlew :client:shadowJar -Pmicrobot.commit.sha="$COMMIT_SHA"

      - name: Read microbot.version from Gradle
        id: version
        run: |
          V=$(./gradlew -q properties --console=plain | sed -n 's/^microbot.version: //p')
          if [ -z "$V" ]; then V=$(grep '^microbot.version=' gradle.properties | cut -d= -f2); fi
          test -n "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Prepare artifact name
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp runelite-client/build/libs/client-*-shaded.jar \
            "runelite-client/build/libs/microbot-${VERSION}-walker-v2.jar"

      - name: Create Walker V2 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          TAG="walker-v2-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" \
            "runelite-client/build/libs/microbot-${VERSION}-walker-v2.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Walker V2 ${VERSION} (build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT})" \
            --notes "Built from Walker-V2 at commit ${COMMIT_SHA}." \
            --prerelease \
            --latest=false
